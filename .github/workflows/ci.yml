name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Select the required gate or the retained emergency rollback path
        required: true
        default: required
        type: choice
        options:
          - required
          - legacy-rollback

permissions:
  contents: read

# Event and mode are both part of the key. A manual rollback therefore cannot cancel an
# authoritative pull-request or main-branch run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.mode || 'required' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-route:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'required' }}
    name: Quality routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    env:
      CI: "true"
      DESEN_REQUIRED_BASE_REVISION: ${{ github.event.pull_request.base.sha || '' }}
      DESEN_REQUIRED_HEAD_REVISION: ${{ github.event.pull_request.head.sha || '' }}
      DESEN_REQUIRED_SAME_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        id: pnpm-cache
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Route fresh required execution
        id: route
        run: node scripts/ci/run-required-affected-quality-gate.mjs --route

  proof-a:
    needs: quality-route
    if: ${{ needs.quality-route.outputs.mode == 'EXHAUSTIVE' }}
    name: Exhaustive proof A
    runs-on: ubuntu-24.04
    # Each isolated workspace keeps the existing two-worker, 18m30s soft / 19m hard bounds.
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.execute.outputs.receipt }}
    env:
      CI: "true"
      DESEN_REQUIRED_HEAD_REVISION: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        id: pnpm-cache
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fresh exhaustive shard
        id: execute
        run: timeout --signal=TERM --kill-after=30s 19m node scripts/ci/run-required-sharded-quality-gate.mjs shard proof-a

  proof-b:
    needs: quality-route
    if: ${{ needs.quality-route.outputs.mode == 'EXHAUSTIVE' }}
    name: Exhaustive proof B
    runs-on: ubuntu-24.04
    # Each isolated workspace keeps the existing two-worker, 18m30s soft / 19m hard bounds.
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.execute.outputs.receipt }}
    env:
      CI: "true"
      DESEN_REQUIRED_HEAD_REVISION: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        id: pnpm-cache
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fresh exhaustive shard
        id: execute
        run: timeout --signal=TERM --kill-after=30s 19m node scripts/ci/run-required-sharded-quality-gate.mjs shard proof-b

  proof-c:
    needs: quality-route
    if: ${{ needs.quality-route.outputs.mode == 'EXHAUSTIVE' }}
    name: Exhaustive proof C
    runs-on: ubuntu-24.04
    # Each isolated workspace keeps the existing two-worker, 18m30s soft / 19m hard bounds.
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.execute.outputs.receipt }}
    env:
      CI: "true"
      DESEN_REQUIRED_HEAD_REVISION: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        id: pnpm-cache
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter proof Chromium runtime
        run: pnpm --filter @desen/starter-catalog-web-proof exec playwright install --with-deps chromium

      - name: Run fresh exhaustive shard
        id: execute
        run: timeout --signal=TERM --kill-after=30s 19m node scripts/ci/run-required-sharded-quality-gate.mjs shard proof-c

  quality:
    needs: [quality-route, proof-a, proof-b, proof-c]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'required') }}
    name: Quality gate
    runs-on: ubuntu-24.04
    # The required check never succeeds merely because a dependency was skipped or cancelled.
    # Affected execution retains its original runner. Exhaustive execution joins all three
    # exact-revision shards, rebuilds locally, and runs the unchanged closing boundary workloads.
    timeout-minutes: 25
    env:
      CI: "true"
      DESEN_REQUIRED_BASE_REVISION: ${{ github.event.pull_request.base.sha || '' }}
      DESEN_REQUIRED_HEAD_REVISION: ${{ github.event.pull_request.head.sha || '' }}
      DESEN_REQUIRED_SAME_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Require a valid routing result
        env:
          DESEN_ROUTE_RESULT: ${{ needs.quality-route.result }}
          DESEN_ROUTE_MODE: ${{ needs.quality-route.outputs.mode }}
          DESEN_SHARD_A_RESULT: ${{ needs.proof-a.result }}
          DESEN_SHARD_B_RESULT: ${{ needs.proof-b.result }}
          DESEN_SHARD_C_RESULT: ${{ needs.proof-c.result }}
        run: |
          test "$DESEN_ROUTE_RESULT" = success
          case "$DESEN_ROUTE_MODE" in
            AFFECTED)
              test "$DESEN_SHARD_A_RESULT" = skipped
              test "$DESEN_SHARD_B_RESULT" = skipped
              test "$DESEN_SHARD_C_RESULT" = skipped
              ;;
            EXHAUSTIVE)
              test "$DESEN_SHARD_A_RESULT" = success
              test "$DESEN_SHARD_B_RESULT" = success
              test "$DESEN_SHARD_C_RESULT" = success
              ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        id: pnpm-cache
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter proof Chromium runtime
        if: ${{ needs.quality-route.outputs.mode == 'AFFECTED' }}
        run: pnpm --filter @desen/starter-catalog-web-proof exec playwright install --with-deps chromium

      - name: Verify required-exhaustive contracts
        run: |
          node scripts/ci/verify-proof-reader-checkpoints.mjs
          node --test scripts/ci/test/proof-reader-checkpoints.test.mjs
          node scripts/ci/verify-infrastructure-debt.mjs
          node --test scripts/ci/test/infrastructure-debt.test.mjs
          node --test scripts/ci/test/exhaustive-workload-inventory.test.mjs
          node --test scripts/ci/test/exhaustive-gate-boundary.test.mjs
          node --test scripts/ci/test/shared-state-authority.test.mjs
          node --test scripts/ci/test/required-exhaustive-equivalence.test.mjs
          node --test scripts/ci/test/required-exhaustive-quality-gate.test.mjs
          node --test scripts/ci/test/affected-change-boundary.test.mjs
          node --test scripts/ci/test/affected-workload-ownership.test.mjs
          node --test scripts/ci/test/affected-impact-graph.test.mjs
          node --test scripts/ci/test/affected-observation-threshold.test.mjs
          node --test scripts/ci/test/affected-workload-selector.test.mjs
          node scripts/ci/verify-affected-selector-promotion-evidence.mjs
          node --test scripts/ci/test/affected-selector-promotion-evidence.test.mjs
          node --test scripts/ci/test/required-affected-quality-gate.test.mjs
          node --test scripts/ci/test/sharded-quality-gate.test.mjs

      - name: Run required quality gate
        if: ${{ needs.quality-route.outputs.mode == 'AFFECTED' }}
        run: timeout --signal=TERM --kill-after=30s 19m node scripts/ci/run-required-affected-quality-gate.mjs

      - name: Join fresh exhaustive quality gate
        if: ${{ needs.quality-route.outputs.mode == 'EXHAUSTIVE' }}
        env:
          DESEN_REQUIRED_SHARD_JOIN_NEEDS: ${{ toJSON(needs) }}
        run: timeout --signal=TERM --kill-after=30s 19m node scripts/ci/run-required-sharded-quality-gate.mjs join

      - name: Save trusted pnpm store
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  browser-e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'required' }}
    name: Browser E2E
    runs-on: ubuntu-24.04
    # This exact-head browser proof runs in parallel with the required quality gate so its
    # production-bundle and Chromium setup do not extend the quality gate's critical path.
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          DESEN_BROWSER_E2E_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DESEN_BROWSER_E2E_HEAD_REVISION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: browser-pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime
        run: pnpm --filter @desen/app-browser-e2e exec playwright install --with-deps chromium

      - name: Run browser E2E proof
        run: pnpm --filter @desen/app-browser-e2e test:e2e

      - name: Verify frozen browser-proof evidence
        run: |
          node scripts/verify-desen-app-browser-e2e-workspace-compatibility.mjs
          node --test tests/desen-app-browser-e2e-workspace-compatibility.test.mjs
          node scripts/verify-desen-app-user-created-blank-project.mjs
          node --test tests/desen-app-user-created-blank-project.test.mjs
          node scripts/verify-desen-app-visual-behavior-authoring.mjs
          node --test tests/desen-app-visual-behavior-authoring.test.mjs
          node scripts/verify-desen-app-evergreen-product-composition.mjs
          node --test tests/desen-app-evergreen-product-composition.test.mjs
          node scripts/verify-desen-app-input-pending-fixture.mjs
          node --test tests/desen-app-input-pending-fixture.test.mjs
          node scripts/verify-desen-app-failure-fixture.mjs
          node --test tests/desen-app-failure-fixture.test.mjs
          node scripts/verify-desen-app-success-host-operation.mjs
          node --test tests/desen-app-success-host-operation.test.mjs
          node scripts/verify-desen-app-published-host-update.mjs
          node --test tests/desen-app-published-host-update.test.mjs
          node scripts/verify-desen-app-invalid-publication.mjs
          node --test tests/desen-app-invalid-publication.test.mjs

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desen-app-browser-e2e/playwright-report/
            apps/desen-app-browser-e2e/test-results/
          if-no-files-found: warn
          retention-days: 7

  legacy-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'legacy-rollback' }}
    name: Legacy rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Enable Corepack
        run: corepack enable

      - name: Read pnpm store path
        id: legacy-pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.legacy-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.10.0-pnpm-11.15.1-

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install starter proof Chromium runtime
        run: pnpm --filter @desen/starter-catalog-web-proof exec playwright install --with-deps chromium

      - name: Run retained legacy rollback
        run: node scripts/run-ci-quality-gate.mjs
